<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var holder = document.getElementById("cv-pages");
  var status = document.getElementById("cv-status");
  var url = document.getElementById("cv-file").getAttribute("href");

  function fail() {
    status.innerHTML = 'The CV could not be shown here. <a href="' + url + '">Open it as a PDF</a>.';
  }

  if (!window.pdfjsLib) { fail(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  pdfjsLib.getDocument(url).promise.then(function (pdf) {
    var ratio = Math.min(window.devicePixelRatio || 1, 2.5);
    var width = holder.clientWidth;
    var chain = Promise.resolve();
    for (var n = 1; n <= pdf.numPages; n++) {
      (function (num) {
        chain = chain.then(function () { return pdf.getPage(num); }).then(function (page) {
          var base = page.getViewport({ scale: 1 });
          var viewport = page.getViewport({ scale: (width / base.width) * ratio });
          var canvas = document.createElement("canvas");
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          canvas.setAttribute("role", "img");
          canvas.setAttribute("aria-label", "CV page " + num + " of " + pdf.numPages);
          holder.appendChild(canvas);
          return page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise;
        });
      })(n);
    }
    return chain.then(function () { status.remove(); });
  }).catch(fail);
})();
</script>

</body>
